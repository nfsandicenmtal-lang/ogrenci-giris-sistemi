
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Öğrenci Giriş Takip Sistemi</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f4f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .panel {
      background: white;
      max-width: 500px;
      margin: 20px auto;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 12px #0001;
    }

    h2 { color: #17365d; }

    button {
      padding: 14px 22px;
      margin: 8px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 17px;
    }

    #reader {
      width: 100%;
      margin: 15px auto;
    }

    #sonuc {
      font-size: 18px;
      font-weight: bold;
      margin: 15px;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <div class="panel">
    <h2>Nefise Andiçen MTAL</h2>
    <h3>Öğrenci Giriş Takip Sistemi</h3>

    <div id="reader"></div>

    <button onclick="kamerayiAc()">Kamerayı Aç</button>
    <button onclick="kamerayiKapat()">Kamerayı Kapat</button>

    <div id="sonuc">Kamera açılmaya hazır.</div>
  </div>

  <iframe
    name="kayitFrame"
    id="kayitFrame"
    style="display:none;">
  </iframe>

  <form
    id="kayitForm"
    method="POST"
    target="kayitFrame"
    action="https://script.google.com/macros/s/AKfycbz_AB4ixPAsayv6RpBu-mUDJRY_JRVHX-7SCo3TxKA0KDhvDsSdxQFwH8tryta6ckb78g/exec">

    <input type="hidden" name="pin" id="pinBilgisi">
    <input type="hidden" name="qr" id="qrBilgisi">

  </form>

  <script>
    let okuyucu = null;
    let isleniyor = false;
    let ses = null;
    let zamanlayici = null;

    // SES SİSTEMİ

    function sesHazirla() {
      try {
        const AudioContext =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContext) return;

        if (!ses) {
          ses = new AudioContext();
        }

        if (ses.state === "suspended") {
          ses.resume();
        }

      } catch (e) {
        console.log("Ses hatası:", e);
      }
    }

    function tonCal(frekans, sure, gecikme = 0) {
      try {
        if (!ses) return;

        if (ses.state === "suspended") {
          ses.resume();
        }

        const osilator = ses.createOscillator();
        const kazanc = ses.createGain();

        const baslangic = ses.currentTime + gecikme;

        osilator.type = "sine";
        osilator.frequency.value = frekans;

        kazanc.gain.setValueAtTime(0.001, baslangic);

        kazanc.gain.exponentialRampToValueAtTime(
          0.20,
          baslangic + 0.02
        );

        kazanc.gain.exponentialRampToValueAtTime(
          0.001,
          baslangic + sure
        );

        osilator.connect(kazanc);
        kazanc.connect(ses.destination);

        osilator.start(baslangic);
        osilator.stop(baslangic + sure);

      } catch (e) {
        console.log("Ses çalma hatası:", e);
      }
    }

    function okumaSesi() {
      tonCal(1100, 0.15);
    }

    function basariSesi() {
      tonCal(880, 0.15);
      tonCal(1320, 0.20, 0.20);
    }

    function hataSesi() {
      tonCal(250, 0.30);
      tonCal(180, 0.30, 0.35);
    }

    // KAMERA

    async function kamerayiAc() {
      sesHazirla();

      try {
        if (!okuyucu) {
          okuyucu = new Html5Qrcode("reader");
        }

        if (okuyucu.isScanning) return;

        await okuyucu.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          kodOkundu
        );

        document.getElementById("sonuc").textContent =
          "QR kod okutabilirsiniz.";

      } catch (e) {
        document.getElementById("sonuc").textContent =
          "Kamera açılamadı: " + e.message;

        hataSesi();
      }
    }

    async function kamerayiKapat() {
      try {
        if (okuyucu && okuyucu.isScanning) {
          await okuyucu.stop();
        }

        document.getElementById("sonuc").textContent =
          "Kamera kapatıldı.";

      } catch (e) {
        document.getElementById("sonuc").textContent =
          "Kamera kapatılamadı: " + e.message;
      }
    }

    // QR OKUNDUĞUNDA

    function kodOkundu(kod) {
      if (isleniyor) return;

      isleniyor = true;

      okumaSesi();

      const sonuc = document.getElementById("sonuc");

      sonuc.textContent = "Öğrenci kontrol ediliyor...";

      let pin = sessionStorage.getItem("okul_pin");

      if (!pin) {
        pin = prompt("6 haneli okul PIN kodunu giriniz:");

        if (!pin || !/^\d{6}$/.test(pin)) {
          sonuc.textContent =
            "Geçerli 6 haneli PIN girilmedi.";

          hataSesi();
          isleniyor = false;
          return;
        }

        sessionStorage.setItem("okul_pin", pin);
      }

      document.getElementById("pinBilgisi").value = pin;
      document.getElementById("qrBilgisi").value = kod;

      sonuc.textContent = "Kayıt gönderiliyor...";

      clearTimeout(zamanlayici);

      zamanlayici = setTimeout(function() {
        sonuc.textContent =
          "Sunucudan yanıt alınamadı. E-Tabloyu kontrol edin.";

        hataSesi();
        isleniyor = false;
      }, 15000);

      try {
        document.getElementById("kayitForm").submit();

      } catch (e) {
        clearTimeout(zamanlayici);

        sonuc.textContent =
          "Gönderim hatası: " + e.message;

        hataSesi();
        isleniyor = false;
      }
    }

    // GOOGLE APPS SCRIPT YANITI

    window.addEventListener("message", function(event) {
      const iframe = document.getElementById("kayitFrame");

      if (event.source !== iframe.contentWindow) {
        return;
      }

      clearTimeout(zamanlayici);

      const sonuc = document.getElementById("sonuc");

      try {
        let cevap = event.data;

        if (typeof cevap === "string") {
          cevap = JSON.parse(cevap);
        }

        if (typeof cevap === "string") {
          cevap = JSON.parse(cevap);
        }

        if (cevap.success) {
          const ogrenci = cevap.student || {};

          sonuc.textContent =
            "KAYIT BAŞARILI\n" +
            (ogrenci.name || "Öğrenci") +
            " - " +
            (ogrenci.className || "");

          basariSesi();

        } else {
          sonuc.textContent =
            cevap.message || "Kayıt başarısız.";

          hataSesi();
        }

      } catch (e) {
        sonuc.textContent =
          "Sunucu yanıtı okunamadı. E-Tabloyu kontrol edin.";

        hataSesi();
      }

      isleniyor = false;
    });

  </script>

</body>
</html>
