<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Öğrenci Giriş Takip Sistemi</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: Arial, sans-serif; background: #f1f4f8; margin: 0; padding: 20px; text-align: center; }
    .panel { background: white; max-width: 500px; margin: 20px auto; padding: 22px; border-radius: 14px; box-shadow: 0 2px 12px #0001; }
    h2 { color: #17365d; margin-bottom: 5px; }
    h3 { color: #555; margin-top: 0; font-weight: normal; }

    button { padding: 14px 22px; margin: 8px 0; border: 0; border-radius: 8px; background: #1769aa; color: white; font-size: 17px; cursor: pointer; width: 100%; }
    button:active { background: #125082; }
    button:disabled { background: #ccc; cursor: not-allowed; }

    #reader { width: 100%; margin: 15px auto; }

    #sonuc { font-size: 18px; font-weight: bold; margin: 15px 0; padding: 15px; border-radius: 8px; background: #f8f9fa; color: #333; }
    .success { color: #155724; background-color: #d4edda !important; }
    .error { color: #721c24; background-color: #f8d7da !important; }
    .warning { color: #856404; background-color: #fff3cd !important; }
    .info { color: #0c5460; background-color: #d1ecf1 !important; }

    /* Öğrenci Kartı (fotoğraf + bilgiler) */
    #ogrenciKart { display: none; align-items: center; gap: 18px; margin: 15px 0; padding: 14px; background: #f7f9fc; border: 2px solid #17365d; border-radius: 12px; text-align: left; }
    #ogrenciFoto { width: 120px; height: 160px; flex-shrink: 0; object-fit: cover; border-radius: 8px; background: #e3e8f0; border: 1px solid #c5cedb; }
    #fotoYok { width: 120px; height: 160px; flex-shrink: 0; display: none; align-items: center; justify-content: center; border-radius: 8px; background: #e3e8f0; border: 1px solid #c5cedb; color: #5a6678; font-size: 13px; text-align: center; }
    #ogrenciBilgi { min-width: 0; }
    #ogrenciAd { font-size: 21px; font-weight: bold; color: #17365d; margin-bottom: 6px; overflow-wrap: anywhere; }
    #ogrenciSinifNo { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
    #ogrenciSaat { font-size: 15px; color: #444; }
    @media (max-width: 420px) { #ogrenciKart { flex-direction: column; text-align: center; } }

    /* Manuel Giriş Alanı */
    .manuel-panel { background: #eaf2f8; padding: 20px; border-radius: 12px; margin-top: 20px; }
    .manuel-panel h4 { color: #17365d; margin: 0 0 15px 0; font-size: 20px; }
    .manuel-panel input { padding: 15px; font-size: 16px; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; text-align: center; }
    .manuel-panel button { background: #1769aa; font-size: 18px; font-weight: bold; padding: 15px; }

    /* Geç Kaldı Uyarısı */
    .gec-kaldi { color: #d9534f; font-size: 20px; font-weight: bold; margin: 15px 0; display: none; }

    /* İhlal Paneli */
    #ihlalAlani { display: none; background: #fdf2f2; padding: 20px; border-radius: 12px; margin-top: 20px; text-align: left; }
    #ihlalAlani h4 { color: #d9534f; text-align: center; margin-top: 0; font-size: 20px; }

    .ihlal-satir { background: white; padding: 15px; margin-bottom: 8px; border-radius: 8px; display: flex; align-items: center; border: 1px solid #eee; cursor: pointer; font-size: 18px; }
    .ihlal-satir input[type="checkbox"] { width: 24px; height: 24px; margin: 0 15px 0 0; cursor: pointer; flex-shrink: 0; }

    .btn-kaydet-ihlal { background: #c9302c; color: white; font-size: 18px; font-weight: bold; padding: 18px; margin-top: 15px; display: none; }
  </style>
</head>

<body>

  <div class="panel">
    <h2>Nefise Andiçen MTAL</h2>
    <h3>Öğrenci Giriş Takip Sistemi</h3>

    <div id="reader"></div>
    <button id="acButonu" onclick="kamerayiAc()">Kamerayı Aç</button>
    <button onclick="kamerayiKapat()">Kamerayı Kapat</button>

    <div id="sonuc" class="info">Kamera açılmaya hazır.</div>

    <!-- Okutulan öğrencinin fotoğrafı ve bilgileri -->
    <div id="ogrenciKart">
      <img id="ogrenciFoto" alt="Öğrenci fotoğrafı">
      <div id="fotoYok">Fotoğraf<br>bulunamadı</div>
      <div id="ogrenciBilgi">
        <div id="ogrenciAd"></div>
        <div id="ogrenciSinifNo"></div>
        <div id="ogrenciSaat"></div>
      </div>
    </div>

    <div id="gecKaldiUyari" class="gec-kaldi">GEÇ KALDI</div>

    <!-- QR Kartı Olmayan Öğrenci -->
    <div class="manuel-panel">
      <h4>QR Kartı Olmayan Öğrenci</h4>
      <input type="number" id="manuelNo" placeholder="Öğrenci okul numarasını giriniz">
      <button onclick="manuelAra()">ÖĞRENCİYİ BUL VE GİRİŞ YAP</button>
    </div>

    <!-- İhlal Listesi -->
    <div id="ihlalAlani">
      <h4>İhlal Türünü Seçin</h4>

      <label class="ihlal-satir"><input type="checkbox" value="Kılık kıyafet uygun değil">Kılık kıyafet uygun değil</label>
      <label class="ihlal-satir"><input type="checkbox" value="Cep telefonu">Cep telefonu</label>
      <label class="ihlal-satir"><input type="checkbox" value="Sigara / tütün ürünü">Sigara / tütün ürünü</label>
      <label class="ihlal-satir"><input type="checkbox" value="Elektronik sigara">Elektronik sigara</label>
      <label class="ihlal-satir"><input type="checkbox" value="Makyaj malzemesi">Makyaj malzemesi</label>
      <label class="ihlal-satir"><input type="checkbox" value="Diğer">Diğer</label>

      <button id="btnIhlalKaydet" class="btn-kaydet-ihlal" onclick="seciliIhlalleriKaydet()">SEÇİLEN İHLALLERİ KAYDET</button>
    </div>

  </div>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbz_AB4ixPAsayv6RpBu-mUDJRY_JRVHX-7SCo3TxKA0KDhvDsSdxQFwH8tryta6ckb78g/exec";

    let okuyucu = null;
    let isleniyor = false;
    let ses = null;
    let zamanlayici = null;
    let aktifOgrenci = null;

    // PIN: sayfanın kodunda yazılı DEĞİL; ilk işlemde sorulur ve
    // tarayıcı sekmesi kapanana kadar hatırlanır.
    function pinAl() {
      let pin = sessionStorage.getItem("okul_pin");
      if (pin) return pin;
      pin = prompt("6 haneli okul PIN kodunu giriniz:");
      if (!pin || !/^\d{6}$/.test(pin.trim())) return null;
      pin = pin.trim();
      sessionStorage.setItem("okul_pin", pin);
      return pin;
    }

    // SES SİSTEMİ
    function sesHazirla() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!ses) { ses = new AudioContext(); }
        if (ses.state === "suspended") { ses.resume(); }
        const osilatör = ses.createOscillator(); const sesSeviyesi = ses.createGain();
        sesSeviyesi.gain.value = 0.001; osilatör.connect(sesSeviyesi); sesSeviyesi.connect(ses.destination);
        osilatör.start(); osilatör.stop(ses.currentTime + 0.03);
      } catch (e) { console.log("Ses başlatılamadı:", e); }
    }
    function tonCal(frekans, sure, gecikme = 0) {
      try {
        if (!ses) return;
        if (ses.state === "suspended") { ses.resume(); }
        const osilator = ses.createOscillator(); const kazanc = ses.createGain();
        osilator.type = "sine"; osilator.frequency.value = frekans;
        const baslangic = ses.currentTime + gecikme;
        kazanc.gain.setValueAtTime(0.001, baslangic);
        kazanc.gain.exponentialRampToValueAtTime(0.25, baslangic + 0.02);
        kazanc.gain.exponentialRampToValueAtTime(0.001, baslangic + sure);
        osilator.connect(kazanc); kazanc.connect(ses.destination);
        osilator.start(baslangic); osilator.stop(baslangic + sure);
      } catch (e) { console.log("Ses çalma hatası:", e); }
    }
    function okumaSesi() { tonCal(1100, 0.15); }
    function basariSesi() { tonCal(880, 0.15); tonCal(1320, 0.20, 0.18); }
    function gecKalmaSesi() { tonCal(600, 0.15); tonCal(450, 0.25, 0.18); }
    function hataSesi() { tonCal(250, 0.35); tonCal(180, 0.35, 0.38); }

    // KAMERA
    async function kamerayiAc() {
      sesHazirla();
      try {
        if (typeof Html5Qrcode === "undefined") { throw new Error("QR okuyucu yüklenemedi. İnternet bağlantısını kontrol edin."); }
        if (!okuyucu) { okuyucu = new Html5Qrcode("reader"); }
        if (okuyucu.isScanning) return;
        await okuyucu.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, kodOkundu);
        sonucGoster("QR kod okutabilirsiniz.", "info");
        paneliSifirla();
      } catch (e) { sonucGoster("Kamera açılamadı: " + (e.message || e), "error"); }
    }

    async function kamerayiKapat() {
      if (okuyucu && okuyucu.isScanning) { await okuyucu.stop(); }
      sonucGoster("Kamera kapatıldı.", "info");
    }

    function sonucGoster(mesaj, tip) {
      const el = document.getElementById("sonuc");
      el.innerHTML = mesaj;
      el.className = tip;
    }

    // Sunucudan gelen yazıları ekrana güvenle yazmak için
    function guvenli(yazi) {
      const d = document.createElement("div");
      d.textContent = yazi == null ? "" : String(yazi);
      return d.innerHTML;
    }

    function ogrenciKartiniGoster(ogrenci) {
      document.getElementById("ogrenciAd").textContent = ogrenci.name || "Öğrenci";
      document.getElementById("ogrenciSinifNo").textContent = (ogrenci.className || "") + " | No: " + (ogrenci.no || "");
      document.getElementById("ogrenciSaat").textContent = "Giriş: " + (ogrenci.date || "") + " " + (ogrenci.time || "");

      const foto = document.getElementById("ogrenciFoto");
      const fotoYok = document.getElementById("fotoYok");
      if (ogrenci.photo) {
        foto.src = ogrenci.photo;
        foto.style.display = "block";
        fotoYok.style.display = "none";
      } else {
        foto.removeAttribute("src");
        foto.style.display = "none";
        fotoYok.style.display = "flex";
      }
      document.getElementById("ogrenciKart").style.display = "flex";
    }

    function ogrenciKartiniGizle() {
      document.getElementById("ogrenciKart").style.display = "none";
      document.getElementById("ogrenciFoto").removeAttribute("src");
    }

    function paneliSifirla() {
      document.getElementById("ihlalAlani").style.display = "none";
      document.getElementById("gecKaldiUyari").style.display = "none";
      document.getElementById("btnIhlalKaydet").style.display = "none";
      document.querySelectorAll('#ihlalAlani input[type="checkbox"]').forEach(cb => cb.checked = false);
      ogrenciKartiniGizle();
      aktifOgrenci = null;
    }

    function ihlalButonKontrol() {
      const seciliVar = Array.from(document.querySelectorAll('#ihlalAlani input[type="checkbox"]')).some(cb => cb.checked);
      document.getElementById("btnIhlalKaydet").style.display = seciliVar ? "block" : "none";
    }

    // Kutuya ya da yazısına dokunulduğunda kaydet butonunu güncelle
    document.querySelectorAll('#ihlalAlani input[type="checkbox"]').forEach(cb => {
      cb.addEventListener("change", ihlalButonKontrol);
    });

    // QR OKUNDUĞUNDA
    function kodOkundu(kod) {
      if (isleniyor) return;
      isleniyor = true;
      okumaSesi();
      sonucGoster("Kayıt kontrol ediliyor...", "info");
      paneliSifirla();

      clearTimeout(zamanlayici);
      zamanlayici = setTimeout(function() {
        sonucGoster("Sunucudan yanıt alınamadı (Zaman Aşımı).", "error");
        hataSesi(); isleniyor = false;
      }, 15000);

      veriGonder({ qr: kod }, function(cevap) {
        clearTimeout(zamanlayici);
        isleniyor = false;
        cevapIsle(cevap);
      });
    }

    // MANUEL ARAMA
    function manuelAra() {
      if (isleniyor) return;
      const no = document.getElementById("manuelNo").value.trim();
      if (!no) { alert("Lütfen bir okul numarası girin!"); return; }

      sesHazirla();
      isleniyor = true;
      sonucGoster("Öğrenci aranıyor...", "info");
      paneliSifirla();

      veriGonder({ action: "manual", schoolNo: no }, function(cevap) {
        isleniyor = false;
        document.getElementById("manuelNo").value = "";
        cevapIsle(cevap);
      });
    }

    // İHLAL KAYDETME
    function seciliIhlalleriKaydet() {
      if (!aktifOgrenci || !aktifOgrenci.no) return;

      const secilenler = Array.from(document.querySelectorAll('#ihlalAlani input[type="checkbox"]:checked')).map(cb => cb.value);
      if (secilenler.length === 0) return;

      const ihlalMetni = secilenler.join(", ");
      const buton = document.getElementById("btnIhlalKaydet");
      buton.disabled = true;
      sonucGoster("İhlaller kaydediliyor...", "info");

      veriGonder({ action: "violation", schoolNo: aktifOgrenci.no, violationType: ihlalMetni }, function(cevap) {
        buton.disabled = false;
        if (cevap.success) {
          sonucGoster("✅ " + guvenli(cevap.message) + "<br><small>(" + guvenli(aktifOgrenci.name) + ")</small>", "success");
          basariSesi();
          paneliSifirla();
        } else {
          sonucGoster("❌ " + guvenli(cevap.message), "error");
          hataSesi();
        }
      });
    }

    // SUNUCUYA VERİ GÖNDERME (POST)
    function veriGonder(params, callback) {
      const pin = pinAl();
      if (!pin) {
        callback({ success: false, message: "Geçerli 6 haneli PIN girilmedi." });
        return;
      }

      // Form biçiminde (urlencoded) gönderilir; Apps Script bu biçimi
      // e.parameter içine doğrudan alır.
      const veri = new URLSearchParams();
      veri.append("pin", pin);
      for (let key in params) {
        veri.append(key, params[key]);
      }

      fetch(APP_URL, { method: "POST", body: veri })
        .then(response => response.json())
        .then(data => {
          if (!data.success && data.message && data.message.toLocaleLowerCase("tr-TR").includes("pin")) {
            sessionStorage.removeItem("okul_pin");
          }
          callback(data);
        })
        .catch(error => {
          console.error("Bağlantı Hatası:", error);
          callback({ success: false, message: "Sunucuya bağlanılamadı. İnternetinizi kontrol edin." });
        });
    }

    // GELEN CEVABI İŞLEME
    function cevapIsle(cevap) {
      try {
        if (cevap.success) {
          const ogrenci = cevap.student || {};
          aktifOgrenci = ogrenci;

          if (cevap.alreadyRecorded) {
            sonucGoster("⚠️ Bu öğrenci bugün zaten giriş yapmış.", "warning");
            gecKalmaSesi();
          } else {
            sonucGoster("✅ GİRİŞ BAŞARILI", "success");
            if (ogrenci.late) { gecKalmaSesi(); } else { basariSesi(); }
          }

          ogrenciKartiniGoster(ogrenci);

          if (ogrenci.late) {
            document.getElementById("gecKaldiUyari").style.display = "block";
          }

          // Öğrenci bulunduysa ihlal listesini aç
          document.getElementById("ihlalAlani").style.display = "block";

        } else {
          sonucGoster("❌ " + guvenli(cevap.message || "Kayıt başarısız."), "error");
          hataSesi();
          paneliSifirla();
        }
      } catch (e) {
        sonucGoster("❌ Yanıt işlenemedi.", "error");
        console.error(e); hataSesi();
      }
    }
  </script>

</body>
</html>
