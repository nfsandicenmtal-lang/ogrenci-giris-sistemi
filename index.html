
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Öğrenci Giriş Takip Sistemi</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f4f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .panel {
      background: white;
      max-width: 500px;
      margin: 20px auto;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 12px #0001;
    }

    h2 { color: #17365d; }

    button {
      padding: 14px 22px;
      margin: 8px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin: 15px auto;
    }

    #sonuc {
      font-size: 18px;
      font-weight: bold;
      margin: 15px;
      white-space: pre-line;
    }

    #gecDurumu {
      color: #c62828;
      font-weight: bold;
    }

    #ihlalAlani {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #fff5f5;
      border-radius: 10px;
      text-align: left;
    }

    #ihlalAlani h3 {
      text-align: center;
      color: #c62828;
    }

    .ihlalSecenek {
      display: block;
      padding: 10px;
      margin: 6px 0;
      background: white;
      border-radius: 6px;
      font-size: 16px;
    }

    .ihlalSecenek input {
      transform: scale(1.3);
      margin-right: 10px;
    }

    #ihlalKaydetButonu {
      display: block;
      width: 100%;
      margin: 15px auto 5px;
      background: #c62828;
      font-weight: bold;
    }
    #manuelAlan {
  margin-top: 20px;
  padding: 15px;
  background: #eef5fb;
  border-radius: 10px;
}

#manuelAlan h3 {
  color: #17365d;
}

#okulNo {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 18px;
  text-align: center;
}

#manuelButon {
  width: 100%;
  background: #1769aa;
  font-weight: bold;
}
  </style>
</head>

<body>
  <div class="panel">
    <h2>Nefise Andiçen MTAL</h2>
    <h3>Öğrenci Giriş Takip Sistemi</h3>

    <div id="reader"></div>

    <button onclick="kamerayiAc()">Kamerayı Aç</button>
    <button onclick="kamerayiKapat()">Kamerayı Kapat</button>

    <div id="sonuc">Kamera açılmaya hazır.</div>
    <div id="gecDurumu"></div>

    <div id="ihlalAlani">
      <h3>İhlal Türünü Seçin</h3>

      <label class="ihlalSecenek">
        <input type="checkbox" value="KILIK KIYAFET UYGUN DEĞİL">
        Kılık kıyafet uygun değil
      </label>

      <label class="ihlalSecenek">
        <input type="checkbox" value="CEP TELEFONU">
        Cep telefonu
      </label>

      <label class="ihlalSecenek">
        <input type="checkbox" value="SİGARA / TÜTÜN ÜRÜNÜ">
        Sigara / tütün ürünü
      </label>

      <label class="ihlalSecenek">
        <input type="checkbox" value="ELEKTRONİK SİGARA">
        Elektronik sigara
      </label>

      <label class="ihlalSecenek">
        <input type="checkbox" value="MAKYAJ MALZEMESİ">
        Makyaj malzemesi
      </label>

      <label class="ihlalSecenek">
        <input type="checkbox" value="DİĞER">
        Diğer
      </label>

      <button id="ihlalKaydetButonu" onclick="ihlalKaydet()">
        SEÇİLEN İHLALLERİ KAYDET
      </button>
    </div>
  </div>

<script>
const APPS_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbz_AB4ixPAsayv6RpBu-mUDJRY_JRVHX-7SCo3TxKA0KDhvDsSdxQFwH8tryta6ckb78g/exec';

let okuyucu = null;
let isleniyor = false;
let ses = null;
let istekNo = 0;
let mevcutOgrenciNo = null;
let ihlalIsleniyor = false;

function mesaj(yazi) {
  document.getElementById('sonuc').textContent = yazi;
}

function sesHazirla() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ses) ses = new AC();
    if (ses.state === 'suspended') ses.resume();
  } catch (e) {
    console.log(e);
  }
}

function tonCal(frekans, sure, gecikme = 0) {
  try {
    if (!ses) return;

    const osilator = ses.createOscillator();
    const kazanc = ses.createGain();
    const baslangic = ses.currentTime + gecikme;

    osilator.type = 'sine';
    osilator.frequency.value = frekans;

    kazanc.gain.setValueAtTime(0.001, baslangic);
    kazanc.gain.exponentialRampToValueAtTime(0.20, baslangic + 0.02);
    kazanc.gain.exponentialRampToValueAtTime(0.001, baslangic + sure);

    osilator.connect(kazanc);
    kazanc.connect(ses.destination);

    osilator.start(baslangic);
    osilator.stop(baslangic + sure);
  } catch (e) {
    console.log(e);
  }
}

function okumaSesi() {
  tonCal(1100, 0.15);
}

function basariSesi() {
  tonCal(880, 0.15);
  tonCal(1320, 0.20, 0.20);
}

function hataSesi() {
  tonCal(250, 0.30);
  tonCal(180, 0.30, 0.35);
}

function ihlalAlaniniGizle() {
  document.getElementById('ihlalAlani').style.display = 'none';
}

function ihlalSecimleriniTemizle() {
  document.querySelectorAll('#ihlalAlani input[type="checkbox"]')
    .forEach(kutu => {
      kutu.checked = false;
    });
}

async function kamerayiAc() {
  sesHazirla();

  try {
    if (typeof Html5Qrcode === 'undefined') {
      throw new Error('QR okuyucu yüklenemedi. İnternet bağlantısını kontrol edin.');
    }

    if (!okuyucu) {
      okuyucu = new Html5Qrcode('reader');
    }

    if (okuyucu.isScanning) return;

    await okuyucu.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      kodOkundu
    );

    mesaj('QR kod okutabilirsiniz.');

  } catch (e) {
    mesaj('Kamera açılamadı: ' + (e.message || e.name || String(e)));
    hataSesi();
  }
}

async function kamerayiKapat() {
  try {
    if (okuyucu && okuyucu.isScanning) {
      await okuyucu.stop();
    }

    mesaj('Kamera kapatıldı.');

  } catch (e) {
    mesaj('Kamera kapatılamadı: ' + (e.message || String(e)));
  }
}

function jsonpGonder(parametreler, callback) {
  istekNo++;
  const callbackAdi = 'ogrenciCevap_' + istekNo;

  const script = document.createElement('script');
  let tamamlandi = false;
  let zamanlayici = null;

  function temizle() {
    if (tamamlandi) return;
    tamamlandi = true;

    if (zamanlayici) clearTimeout(zamanlayici);

    delete window[callbackAdi];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  }

  window[callbackAdi] = function(cevap) {
    temizle();
    callback(cevap);
  };

  parametreler.callback = callbackAdi;
  parametreler.t = String(Date.now());

  const sorgu = new URLSearchParams(parametreler);
  script.src = APPS_SCRIPT_URL + '?' + sorgu.toString();

  script.onerror = function() {
    temizle();
    callback({
      success: false,
      message: 'Sunucu bağlantı hatası.'
    });
  };

  zamanlayici = setTimeout(function() {
    temizle();
    callback({
      success: false,
      message: '15 saniyede sunucudan yanıt alınamadı.'
    });
  }, 15000);

  document.body.appendChild(script);
}

function sunucuyaGonder(qr, pin) {
  const sonuc = document.getElementById('sonuc');

  jsonpGonder({
    pin: pin,
    qr: qr
  }, function(cevap) {

    isleniyor = false;

    if (cevap && cevap.success) {
      const ogrenci = cevap.student || {};

      mevcutOgrenciNo = ogrenci.no;

      sonuc.textContent =
        'GİRİŞ BİLGİSİ\n' +
        (ogrenci.name || 'Öğrenci') + '\n' +
        (ogrenci.className || '') + ' - ' +
        (ogrenci.no || '') + '\n' +
        (ogrenci.date || '') + ' ' +
        (ogrenci.time || '');

      document.getElementById('gecDurumu').textContent =
        ogrenci.late ? 'GEÇ KALDI' : 'ZAMANINDA';

      ihlalSecimleriniTemizle();
      document.getElementById('ihlalKaydetButonu').disabled = false;
      document.getElementById('ihlalKaydetButonu').textContent =
        'SEÇİLEN İHLALLERİ KAYDET';

      ihlalAlaniniGoster();

      basariSesi();

    } else {
      const hata = cevap && cevap.message
        ? cevap.message
        : 'Sunucudan geçersiz yanıt geldi.';

      sonuc.textContent = 'KAYIT YAPILAMADI\n' + hata;

      document.getElementById('gecDurumu').textContent = '';
      ihlalAlaniniGizle();

      if (hata.toLocaleLowerCase('tr-TR').includes('pin')) {
        sessionStorage.removeItem('okul_pin');
      }

      hataSesi();
    }
  });
}

function ihlalAlaniniGoster() {
  document.getElementById('ihlalAlani').style.display = 'block';
}

function kodOkundu(kod) {
  if (isleniyor || ihlalIsleniyor) return;

  isleniyor = true;
  okumaSesi();

  mevcutOgrenciNo = null;

  ihlalAlaniniGizle();
  ihlalSecimleriniTemizle();
  document.getElementById('gecDurumu').textContent = '';

  mesaj('QR OKUNDU: ' + kod + '\nÖğrenci kontrol ediliyor...');

  let pin = sessionStorage.getItem('okul_pin');

  if (!pin) {
    pin = prompt('6 haneli okul PIN kodunu giriniz:');

    if (!pin || !/^\d{6}$/.test(pin)) {
      mesaj('Geçerli 6 haneli PIN girilmedi.');
      hataSesi();
      isleniyor = false;
      return;
    }

    sessionStorage.setItem('okul_pin', pin);
  }

  sunucuyaGonder(kod, pin);
}

function ihlalKaydet() {
  if (!mevcutOgrenciNo || ihlalIsleniyor) return;

  const secilenler = Array.from(
    document.querySelectorAll('#ihlalAlani input[type="checkbox"]:checked')
  ).map(kutu => kutu.value);

  if (secilenler.length === 0) {
    mesaj('Lütfen en az bir ihlal türü seçin.');
    hataSesi();
    return;
  }

  const pin = sessionStorage.getItem('okul_pin');

  if (!pin) {
    mesaj('PIN bulunamadı. Sayfayı yenileyip tekrar deneyin.');
    return;
  }

  ihlalIsleniyor = true;

  const buton = document.getElementById('ihlalKaydetButonu');
  buton.disabled = true;
  buton.textContent = 'KAYDEDİLİYOR...';

  let basarili = [];
  let basarisiz = [];

  function siradakiKayit(index) {
    if (index >= secilenler.length) {
      ihlalIsleniyor = false;
      buton.disabled = false;
      buton.textContent = 'SEÇİLEN İHLALLERİ KAYDET';

      let sonucMetni = '';

      if (basarili.length > 0) {
        sonucMetni += 'KAYDEDİLENLER:\n' + basarili.join('\n');
      }

      if (basarisiz.length > 0) {
        sonucMetni += (sonucMetni ? '\n\n' : '') +
          'KAYDEDİLEMEYENLER:\n' + basarisiz.join('\n');
      }

      if (basarili.length > 0) {
        mesaj(sonucMetni);
        basariSesi();
      } else {
        mesaj(sonucMetni || 'Hiçbir ihlal kaydedilemedi.');
        hataSesi();
      }

      return;
    }

    const tur = secilenler[index];

    buton.textContent =
      'KAYDEDİLİYOR... (' + (index + 1) + '/' + secilenler.length + ')';

    jsonpGonder({
      pin: pin,
      action: 'violation',
      schoolNo: mevcutOgrenciNo,
      violationType: tur
    }, function(cevap) {

      if (cevap && cevap.success) {
        basarili.push(tur);
      } else {
        basarisiz.push(
          tur + ': ' +
          (cevap && cevap.message
            ? cevap.message
            : 'Kayıt yapılamadı.')
        );
      }

      siradakiKayit(index + 1);
    });
  }

  siradakiKayit(0);
}
</script>
</body>
</html>
