
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Öğrenci Giriş Takip Sistemi</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f4f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .panel {
      background: white;
      max-width: 500px;
      margin: 20px auto;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 12px #0001;
    }

    h2 { color: #17365d; }

    button {
      padding: 14px 22px;
      margin: 8px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 17px;
    }

    #reader { width: 100%; margin: 15px auto; }

    #sonuc {
      font-size: 18px;
      font-weight: bold;
      margin: 15px;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h2>Nefise Andiçen MTAL</h2>
    <h3>Öğrenci Giriş Takip Sistemi</h3>

    <div id="reader"></div>

    <button onclick="kamerayiAc()">Kamerayı Aç</button>
    <button onclick="kamerayiKapat()">Kamerayı Kapat</button>

    <div id="sonuc">Kamera açılmaya hazır.</div>
  </div>

  <script>
    let okuyucu = null;
    let isleniyor = false;

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbz_AB4ixPAsayv6RpBu-mUDJRY_JRVHX-7SCo3TxKA0KDhvDsSdxQFwH8tryta6ckb78g/exec";

    async function kamerayiAc() {
      try {
        if (!okuyucu) {
          okuyucu = new Html5Qrcode("reader");
        }

        await okuyucu.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          kodOkundu
        );

        document.getElementById("sonuc").textContent =
          "QR kod okutabilirsiniz.";

      } catch (e) {
        document.getElementById("sonuc").textContent =
          "Kamera açılamadı: " + e.message;
      }
    }

    async function kamerayiKapat() {
      try {
        if (okuyucu && okuyucu.isScanning) {
          await okuyucu.stop();
        }

        document.getElementById("sonuc").textContent =
          "Kamera kapatıldı.";

      } catch (e) {
        document.getElementById("sonuc").textContent =
          "Kamera kapatılamadı: " + e.message;
      }
    }

    function kodOkundu(kod) {
      if (isleniyor) return;

      isleniyor = true;

      const sonuc = document.getElementById("sonuc");
      sonuc.textContent = "Öğrenci kontrol ediliyor...";

      let pin = sessionStorage.getItem("okul_pin");

      if (!pin) {
        pin = prompt("6 haneli okul PIN kodunu giriniz:");

        if (!pin || !/^\d{6}$/.test(pin)) {
          sonuc.textContent = "Geçerli 6 haneli PIN girilmedi.";
          isleniyor = false;
          return;
        }

        sessionStorage.setItem("okul_pin", pin);
      }

      try {
        const iframe = document.createElement("iframe");
        iframe.name = "kayit_iframe";
        iframe.style.display = "none";
        document.body.appendChild(iframe);

        const form = document.createElement("form");
        form.method = "POST";
        form.action = APPS_SCRIPT_URL;
        form.target = "kayit_iframe";

        const pinInput = document.createElement("input");
        pinInput.type = "hidden";
        pinInput.name = "pin";
        pinInput.value = pin;

        const qrInput = document.createElement("input");
        qrInput.type = "hidden";
        qrInput.name = "qr";
        qrInput.value = kod;

        form.appendChild(pinInput);
        form.appendChild(qrInput);
        document.body.appendChild(form);

        form.submit();
        form.remove();

        sonuc.textContent =
          "Kayıt isteği gönderildi.\n" +
          "Google E-Tablolar'dan kontrol ediniz.";

        setTimeout(() => {
          iframe.remove();
          isleniyor = false;
        }, 4000);

      } catch (e) {
        sonuc.textContent = "Gönderim hatası: " + e.message;
        isleniyor = false;
      }
    }
  </script>
</body>
</html>
